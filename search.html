<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>TechLite - Search</title>
    
    <!-- Styles -->
    <link href="packages/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/techlite.css">
    <link rel="stylesheet" href="assets/css/owl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet"href="https://unpkg.com/swiper@7/swiper-bundle.min.css"/>

    <!-- Scripts -->
    <script src="packages/jquery/jquery.min.js"></script>
    <script src="packages/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/isotope.min.js"></script>
    <script src="assets/js/owl-carousel.js"></script>
    <script src="assets/js/tabs.js"></script>
    <script src="assets/js/popup.js"></script>
    <script src="assets/js/techlite.js"></script>
</head>

<body>
    <!-- Preload Start-->
    <div id="js-preloader" class="js-preloader">
        <div class="preloader-inner">
        <span class="dot"></span>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
        </div>
    </div>
    <!-- Preload End-->

  <!-- Header Start-->
  <header class="header-area header-sticky">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav class="main-nav">
                    <a href="index.html" class="logo">
                        <img src="assets/images/logo.png" alt="">
                    </a>
                    <!-- Menu Start -->
                    <!-- Popup Form (Hidden by default) -->
                    <div id="loginPopup" class="login-popup" style="display: none;">
                      <a href="" class="close">&times;</a>
                      <h4>Login</h4>
                      <form>
                        <input type="text" name="username" class="username form-control" placeholder="Username"/>
                        <input type="password" name="password" class="password form-control" placeholder="password"/>
                        <input class="btn login" type="submit" value="Login" />
                      </form>
                    </div>
                    <ul class="nav">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="reserve.html">Reserve</a></li>
                        <li><a href="search.html" class="active">Search</a></li>
                        <li><a href="services.html">Services</a></li>
                        <li><a href="profile.html">Profile <img src="assets/images/profile.jpg" alt=""></a></li>
                    </ul>
                    <a class='menu-trigger'>
                        <span>Menu</span>
                    </a>
                    <!-- Menu End -->
                </nav>
            </div>
        </div>
    </div>
  </header>
  <!-- Header End -->
  
<div class="main-banner">
<div class="search-page">
    <div class="search-container">
        <label for="searchOptions">Choose a search option:</label>
        <select id="searchOptions" onchange="showSearchForm(this.value)">
            <option value="">Select an Option</option>
            <option value="member">Search Member</option>
            <option value="seats">Search Available Seats</option>
        </select>
    </div>

    <div id="searchMemberForm" class="search-form" style="display:none;">
        <form>
            <label for="memberName">Name:</label>
            <input type="text" id="memberName" name="memberName">
            
            <label for="memberId">ID:</label>
            <input type="text" id="memberId" name="memberId">
            
            <button type="button" onclick="submitMemberSearch()">Search Member</button>
        </form>
    </div>

    <div id="searchSeatsForm" class="search-form" style="display:none;">
        <label for="timeInput">Select Time:</label>
        <input type="time" id="timeInput" name="timeInput">
        <button type="button" onclick="filterSeatsByTime()">Search Seats</button>
    </div>

    <div id="availableSeats" class="seats-container" style="display:none;">
        <!-- Available seats will be dynamically inserted here -->
    </div>
</div>

<div id="reservationForm" class="reservation-form" style="display:none;">
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="timeFrom">Time From:</label>
        <input type="time" id="timeFrom" name="timeFrom" required>
        
        <label for="timeTo">Time To:</label>
        <input type="time" id="timeTo" name="timeTo" required>
        
        <button type="button" onclick="submitReservation()">Reserve</button>
    </form>
</div>
</div>
<script>
    // Ensure your search.js contains the implementation for these functions
</script>

</body>
</html>
